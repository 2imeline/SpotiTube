name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build app + installers
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/spotitube.exe "out/SpotiTube-$v-portable.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "out/SpotiTube-$v-setup.exe" }
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object { Copy-Item $_ "out/SpotiTube-$v.msi" }
          Get-ChildItem out | Format-Table Name, Length
          "version=$v" >> $env:GITHUB_OUTPUT
        id: collect

      - uses: actions/upload-artifact@v4
        with:
          name: SpotiTube-windows
          path: out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'main' || github.ref_name == 'claude/upbeat-noether-1v34ms'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: SpotiTube v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Download
            - **SpotiTube-${{ steps.collect.outputs.version }}-setup.exe** – installer (recommended, per-user, no admin needed)
            - **SpotiTube-${{ steps.collect.outputs.version }}-portable.exe** – single executable, no install
            - **SpotiTube-${{ steps.collect.outputs.version }}.msi** – MSI package for managed installs

            Requires Windows 10/11 (uses the built-in Microsoft Edge WebView2 runtime; the installer fetches it automatically on older systems).
