[package]
name = "spotitube"
version = "1.5.1"
description = "SpotiTube - a lightweight native YouTube Music desktop client"
authors = ["SpotiTube"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "spotitube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "http2", "charset", "blocking", "system-proxy"] }
sha1_smol = "1"
sha2 = "0.10"
tiny_http = "0.12"
urlencoding = "2"
fastrand = "2"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# unwind: a panic in a background task is logged instead of closing the app
panic = "unwind"
strip = true
